# 공개용 설정 예시. 기존 개인 설정을 덮어쓰지 말고 필요한 항목만 병합한다.
# 공식 설정 문서: https://learn.chatgpt.com/docs/config-file/config-reference
# 검증 스키마: https://learn.chatgpt.com/docs/config-schema.json
# 모델은 고정하지 않는다. 계정에서 사용 가능한 모델을 선택한다.
# 아래 추론 강도는 선택한 모델이 지원하는지 확인한다.
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "high"

# 플러그인과 실험 기능은 기본으로 켜지 않는다.
# 설치한 구성요소와 사용 중인 Codex 버전에 맞춰 개인 설정에서 활성화한다.
# 실험 기능 경고를 숨기는 설정도 포함하지 않는다.

[tui]
status_line = ["model-with-reasoning", "context-remaining", "current-dir"]

# 선택 기능: Unity MCP. 브리지 설치 후 개인 설정에 아래 블록을 추가한다.
# 경로를 실제 설치 위치로 바꾸고 연결을 원할 때 enabled를 true로 바꾼다.
# [mcp_servers.unity]
# command = "node"
# args = ["/absolute/path/to/unity-mcp-bridge/server.mjs"]
# enabled = false
# startup_timeout_sec = 30
# tool_timeout_sec = 180
